[project]
name = "agent-wallet"
version = "0.3.0"
description = "MCP server that lets an AI agent pay inside limits the user sets, enforced in code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
]

[project.scripts]
agent-wallet = "agent_wallet.cli:main"
agent-wallet-mcp = "agent_wallet.mcp_server:main"
agent-wallet-http = "agent_wallet.http_server:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_wallet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
